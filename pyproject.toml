[project]
name = "failure-tracker"
version = "0.1.0"
description = "Track recurring workflow, skill, and tool failures in SQLite for parallel agent self-improvement"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
failure-tracker = "failure_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/failure_tracker"]
